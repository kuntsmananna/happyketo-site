# Weekly speed measurement for the site dashboard (scripts/metrics/measure-speed.mjs).
# Commits src/data/metrics/speed.json; the push makes Vercel rebuild, so the dashboard shows the new numbers.
name: Weekly site metrics

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC (07:17 in Israel in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-metrics
  cancel-in-progress: false

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lighthouse
        run: npm install --no-audit --no-fund
        working-directory: scripts/metrics
      - name: Measure
        run: node measure-speed.mjs
        working-directory: scripts/metrics
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/metrics/speed.json
          git diff --cached --quiet && exit 0
          git commit -m "Weekly speed measurement"
          git push
