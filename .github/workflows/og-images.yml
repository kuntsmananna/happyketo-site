# Branded share images (scripts/og/render-og.mjs): after content changes, render cards for new or changed recipes and
# posts and commit them to public/og. Until a card exists, pages fall back to the plain cover photo.
name: Share images

on:
  push:
    branches: [main]
    paths:
      - 'src/content/**'
      - 'src/assets/posts/**'
      - 'scripts/og/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: og-images
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install site packages (fonts)
        run: npm ci --no-audit --no-fund
      - name: Install renderer
        working-directory: scripts/og
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Render cards
        run: node scripts/og/render-og.mjs
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og
          git diff --cached --quiet && exit 0
          git commit -m "Update share images"
          git pull --rebase --autostash origin main
          git push
